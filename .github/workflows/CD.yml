name: CD

on:
  push:
    branches: [ "main" ]

jobs:
  CI:
    runs-on: ubuntu-24.04

    steps:
      # 1. 저장소의 코드를 체크아웃
      - name: 체크아웃
        uses: actions/checkout@v3

      # 2. JDK 설치
      - name: JDK17 설치
        uses: actions/setup-java@v3
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: application.yml 파일 생성
        run: |
          ## create application.yml
          mkdir -p ./src/main/resources
          cd ./src/main/resources

          # application.yml 파일 생성
          touch ./application.yml

          # GitHub-Actions 에서 설정한 값을 application.yml 파일에 쓰기
          echo "${{ secrets.CI_APPLICATION }}" >> ./application.yml

      # 4. Gradle 빌드 및 JAR 파일 생성
      - name: JAR 빌드
        run: |
          chmod +x gradlew
          ./gradlew build -x test
        shell: bash

      # 5. Docker Hub 로그인
      - name: Docker Hub 로그인
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # 6. Docker 이미지 빌드 및 태깅
      - name: Docker Image 빌드 및 태깅
        run: |
          VERSION=0.${{ github.run_number }}
          echo "Using VERSION=$VERSION"
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/woorilog-server:$VERSION .

      # 7. Docker Hub에 푸시
      - name: Docker Image 푸쉬
        run: |
          VERSION=0.${{ github.run_number }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/woorilog-server:$VERSION

  CD:
    needs: CI
    runs-on: ubuntu-22.04

    steps:
      # 1. SSH 액션
      - name: EC2 내부 DOCKER 컨테이너 실행
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_IP }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            DOCKER_USER='${{ secrets.DOCKERHUB_USERNAME }}' \
            DOCKER_PW='${{ secrets.DOCKERHUB_PASSWORD }}' \
            IMAGE_NAME='${{ secrets.DOCKERHUB_USERNAME }}/woorilog-server' \
            IMAGE_TAG='0.${{ github.run_number }}' \
            bash ~/deploy.sh
